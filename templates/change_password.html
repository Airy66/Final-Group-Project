{% extends "product_base.html" %}
{% block title %}Change Password · Precision Curator{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="mb-6">
    <p class="text-xs font-bold uppercase tracking-widest text-primary">Account security</p>
    <h1 class="mt-2 font-display text-3xl font-extrabold text-slate-950">Change password</h1>
    <p class="mt-2 text-sm leading-6 text-slate-600">Confirm your current password before setting a new one.</p>
  </div>
  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <form method="post" action="{{ url_for('change_password') }}" class="grid gap-5">
      <label class="block">
        <span class="text-sm font-bold text-slate-700">Current password</span>
        <input type="password" name="current_password" autocomplete="current-password" required autofocus class="app-input mt-2 w-full px-4 py-3">
      </label>
      <label class="block">
        <span class="text-sm font-bold text-slate-700">New password</span>
        <input type="password" name="new_password" autocomplete="new-password" minlength="8" required class="app-input mt-2 w-full px-4 py-3">
        <span class="mt-2 block text-xs text-slate-500">Use at least 8 characters.</span>
      </label>
      <label class="block">
        <span class="text-sm font-bold text-slate-700">Confirm new password</span>
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required class="app-input mt-2 w-full px-4 py-3">
      </label>
      <div class="flex flex-wrap gap-3 border-t border-slate-100 pt-5">
        <button type="submit" class="app-button-primary">Save password</button>
        <a href="{{ url_for('profile') }}" class="app-button-secondary">Cancel</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
