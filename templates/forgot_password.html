{% extends "product_base.html" %}
{% block title %}Reset password · Precision Curator{% endblock %}
{% block public_content %}
<section class="min-h-[calc(100vh-73px)] bg-gradient-to-br from-blue-50 via-indigo-50 to-white px-5 py-14">
<div class="mx-auto grid max-w-6xl items-center gap-12 lg:grid-cols-2">
  <div class="rounded-[2rem] border border-blue-100 bg-blue-50/70 p-8 shadow-sm">
    <p class="text-sm font-semibold text-blue-700">Return to your workspace</p>
    <h1 class="mt-4 font-display text-5xl font-extrabold text-slate-950">Reset your password</h1>
    <p class="mt-5 max-w-xl text-lg leading-8 text-slate-600">Enter your email and we will help you reset your password.</p>
  </div>
  <div class="space-y-5">
    <form method="post" data-submit-once aria-busy="false" class="rounded-[2rem] border border-white/80 bg-white/95 p-7 shadow-soft backdrop-blur md:p-10">
      <label for="email" class="text-sm font-bold text-slate-700">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com" class="mt-2 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 invalid:border-red-300 invalid:focus:ring-red-100">
      <p class="mt-2 text-xs text-slate-500">Use a valid email address.</p>
      <button data-submit-button class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 py-4 font-bold text-white shadow-lg shadow-blue-500/25 transition hover:from-blue-700 hover:to-indigo-700 hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-blue-300 disabled:cursor-wait disabled:opacity-70">
        <span data-submit-spinner class="hidden" aria-hidden="true"><span class="material-symbols-outlined animate-spin text-xl">progress_activity</span></span>
        <span data-submit-label>Send reset link</span>
      </button>
      <p data-submit-status class="sr-only" aria-live="polite"></p>
    </form>
    <p class="text-sm text-slate-500"><a href="{{ url_for('login') }}" class="font-semibold text-primary hover:text-blue-700">&larr; Back to sign in</a></p>
  </div>
</div></section>
<script>
  (() => {
    const form = document.querySelector('[data-submit-once]');
    if (!form) return;
    const email = form.querySelector('#email');
    const button = form.querySelector('[data-submit-button]');
    const spinner = form.querySelector('[data-submit-spinner]');
    const label = form.querySelector('[data-submit-label]');
    const status = form.querySelector('[data-submit-status]');
    let hiddenEmail = null;

    const restore = () => {
      form.dataset.submitting = 'false';
      form.setAttribute('aria-busy', 'false');
      if (email) email.disabled = false;
      if (button) button.disabled = false;
      spinner?.classList.add('hidden');
      if (label) label.textContent = 'Send reset link';
      if (status) status.textContent = '';
      hiddenEmail?.remove();
      hiddenEmail = null;
    };

    form.addEventListener('invalid', restore, true);
    form.addEventListener('submit', (event) => {
      if (form.dataset.submitting === 'true') {
        event.preventDefault();
        return;
      }
      if (!form.checkValidity()) {
        event.preventDefault();
        restore();
        form.reportValidity();
        return;
      }
      form.dataset.submitting = 'true';
      form.setAttribute('aria-busy', 'true');
      button?.focus({ preventScroll: true });
      if (email) {
        hiddenEmail = document.createElement('input');
        hiddenEmail.type = 'hidden';
        hiddenEmail.name = email.name;
        hiddenEmail.value = email.value;
        form.appendChild(hiddenEmail);
        email.disabled = true;
      }
      if (button) button.disabled = true;
      spinner?.classList.remove('hidden');
      if (label) label.textContent = 'Sending reset link…';
      if (status) status.textContent = 'Sending reset link. Please wait.';
    });
    window.addEventListener('pageshow', restore);
  })();
</script>
{% endblock %}
